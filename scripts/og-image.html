<!doctype html>
<!-- Source for images/og-preview.png (1200x630 link-preview image) and images/apple-touch-icon.png.
     Open in a browser at 1200x630 and screenshot to regenerate after changing the name or colors. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#151515; --bg2:#050505; --bg3:#212713; --lime:#edffc6; --text:#cedfa9; --dim:#a1ae84; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: var(--bg); overflow: hidden; font-family: 'Afacad', sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; background:
      radial-gradient(ellipse 70% 80% at 100% 100%, rgba(237,255,198,.10), transparent 60%),
      radial-gradient(ellipse 90% 70% at 50% 120%, rgba(180,80,20,.20), transparent 60%), var(--bg); }
  .block { position: absolute; right: 0; top: 0; bottom: 0; width: 330px; background: var(--bg3); }
  .block::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: rgba(237,255,198,.25); }
  .eyebrow { position: relative; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; color: var(--lime); }
  .name { position: absolute; left: 66px; top: 108px; color: var(--lime); font-size: 232px; line-height: .82; letter-spacing: -.04em; }
  .name i { display: block; padding-left: 104px; font-weight: 400; }
  .tag { position: absolute; left: 72px; bottom: 64px; font-size: 34px; font-style: italic; color: var(--text); }
  .meta { position: absolute; right: 72px; bottom: 64px; font-size: 24px; letter-spacing: .1em; color: var(--dim); text-align: right; }
  .domain { position: absolute; right: 72px; top: 64px; font-size: 24px; letter-spacing: .1em; color: var(--lime); text-align: right; }
  .frame { position: absolute; inset: 22px; border: 1px solid rgba(237,255,198,.22); pointer-events: none; }
  svg.grain { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .16; mix-blend-mode: screen; }
</style></head>
<body><div class="card">
  <div class="block"></div>
  <div class="eyebrow">Singer · Songwriter · Guitar</div>
  <div class="name">James<i>Fuller</i></div>
  <div class="tag">“Songs for the long drive home”</div>
  <div class="domain">jamesfullermusic.com</div>
  <div class="meta">ORIGINAL MUSIC · LIVE SHOWS</div>
  <div class="frame"></div>
  <svg class="grain" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div></body></html>
